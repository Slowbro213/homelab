apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra

  source:
    repoURL: http://zotregistry.dev/helm-charts/
    chart: zot
    targetRevision: 0.1.112
    helm:
      releaseName: zot
      valuesObject:
        mountConfig: true
        podSecurityContext:
          fsGroup: 10001
          runAsGroup: 10001
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        configFiles:
          config.json: |
            {
              "storage": {
                "rootDirectory": "/var/lib/registry",
                "dedupe": false,
                "storageDriver": {
                  "name": "s3",
                  "region": "us-east-1",
                  "regionendpoint": "http://minio.minio.svc.cluster.local:9000",
                  "bucket": "zot",
                  "secure": false,
                  "forcepathstyle": true
                }
              },
              "http": {
                "address": "0.0.0.0",
                "port": "5000",
                "externalUrl": "https://registry.gentoo.lan",
                "auth": {
                  "failDelay": 5,
                  "htpasswd": {
                    "path": "/etc/zot/auth/.htpasswd"
                  },
                  "openid": {
                    "providers": {
                      "oidc": {
                        "credentialsFile": "/etc/zot/oidc/oidc-credentials.json",
                        "name": "Authentik",
                        "issuer": "https://sso.gentoo.lan/application/o/zot/",
                        "keypath": "",
                        "scopes": ["openid", "profile", "email", "groups"]
                      }
                    }
                  }
                },
                "accessControl": {
                  "repositories": {
                    "**": {
                      "policies": [
                        {
                          "users": ["registry-admin"],
                          "groups": ["zot-pushers"],
                          "actions": ["read", "create", "update", "delete"]
                        }
                      ],
                      "defaultPolicy": ["read"]
                    }
                  },
                  "adminPolicy": {
                    "users": ["registry-admin"],
                    "groups": ["zot-admins"],
                    "actions": ["read", "create", "update", "delete"]
                  }
                }
              },
              "log": {
                "level": "debug"
              },
              "extensions": {
                "search": {
                  "enable": true,
                  "cve": {
                    "updateInterval": "24h",
                    "trivy": {
                      "dbRepository": "ghcr.io/aquasecurity/trivy-db",
                      "javaDBRepository": "ghcr.io/aquasecurity/trivy-java-db"
                    }
                  }
                }
              }
            }

        env:
          - name: SSL_CERT_FILE
            value: /etc/ssl/gentoo/ca.crt
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: zot-s3-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: zot-s3-credentials
                key: AWS_SECRET_ACCESS_KEY

        externalSecrets:
          - secretName: zot-auth
            mountPath: /etc/zot/auth
          - secretName: zot-oidc-credentials
            mountPath: /etc/zot/oidc
          - secretName: gentoo-internal-ca-bundle
            mountPath: /etc/ssl/gentoo

        service:
          type: ClusterIP
          port: 5000

        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: gentoo-internal-ca
          hosts:
            - host: registry.gentoo.lan
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: registry-gentoo-lan-tls
              hosts:
                - registry.gentoo.lan

  destination:
    server: https://kubernetes.default.svc
    namespace: registry

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
