apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infra

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  # Kyverno's admission webhook writes server-side defaults onto every ClusterPolicy that the
  # upstream chart never renders (.spec.admission, .spec.emitWarning, and per-rule
  # .spec.rules[].skipBackgroundRequests), so Argo CD saw permanent drift → OutOfSync with an
  # empty visible diff. Ignore exactly those webhook-added fields. (The repo's own
  # security-baseline ClusterPolicies avoid this by hard-coding admission/emitWarning to match;
  # we can't edit this chart's templates, so we ignore them instead.)
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.rules[].skipBackgroundRequests

  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno-policies
    targetRevision: 3.8.0
    helm:
      releaseName: kyverno-policies
      values: |
        podSecurityStandard: restricted
        validationFailureAction: Enforce
        validationAllowExistingViolations: false
        validationFailureActionOverrides:
          all:
            - action: Audit
              namespaces:
                - kube-system
                - longhorn-system
                - tailscale
                - falco
                # smartctl needs privileged + root + a custom seccomp
                # profile for raw SMART ioctls, same reason as falco.
                - smartctl-exporter
        policyExclude:
          disallow-capabilities-strict:
            any:
              - resources:
                  kinds:
                    - Job
                    - Pod
                  namespaces:
                    - minio
                  names:
                    - minio-post-job*
          disallow-privilege-escalation:
            any:
              - resources:
                  kinds:
                    - Job
                    - Pod
                  namespaces:
                    - minio
                  names:
                    - minio-post-job*
          disallow-host-namespaces:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          disallow-host-ports:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          disallow-host-path:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          restrict-volume-types:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          require-run-as-non-root-user:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
          require-run-as-nonroot:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
          disallow-capabilities-strict:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
        background: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
