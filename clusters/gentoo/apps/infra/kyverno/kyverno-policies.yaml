apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: infra

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno-policies
    targetRevision: 3.8.0
    helm:
      releaseName: kyverno-policies
      values: |
        podSecurityStandard: restricted
        validationFailureAction: Enforce
        validationAllowExistingViolations: false
        validationFailureActionOverrides:
          all:
            - action: Audit
              namespaces:
                - kube-system
                - longhorn-system
                - tailscale
                - falco
        policyExclude:
          disallow-capabilities-strict:
            any:
              - resources:
                  kinds:
                    - Job
                    - Pod
                  namespaces:
                    - minio
                  names:
                    - minio-post-job*
          disallow-privilege-escalation:
            any:
              - resources:
                  kinds:
                    - Job
                    - Pod
                  namespaces:
                    - minio
                  names:
                    - minio-post-job*
          disallow-host-namespaces:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          disallow-host-ports:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          disallow-host-path:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          restrict-volume-types:
            any:
              - resources:
                  kinds:
                    - DaemonSet
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - monitoring-prometheus-node-exporter*
          require-run-as-non-root-user:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
          require-run-as-nonroot:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
          disallow-capabilities-strict:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
          # The gitea-runner builds images with buildah in host mode. buildah must
          # unshare(CLONE_NEWUSER) to build unprivileged, which every non-Unconfined seccomp
          # profile blocks for a process without CAP_SYS_ADMIN. Custom Localhost profiles can't
          # be installed via GitOps here (disallow-host-path blocks an installer DaemonSet), so
          # the runner uses Unconfined seccomp; scope that exception to this pod only, matching
          # the run-as-root / capabilities exceptions above.
          restrict-seccomp:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
          restrict-seccomp-strict:
            any:
              - resources:
                  kinds:
                    - Deployment
                    - Pod
                  namespaces:
                    - gitea-runners
                  names:
                    - gitea-runner
                    - gitea-runner-*
        background: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
