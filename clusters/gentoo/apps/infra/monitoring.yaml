apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: infra

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 84.5.0
    helm:
      releaseName: monitoring
      valuesObject:
        # k3s control-plane components are not exposed as scrapeable cluster services.
        # Keep their "down" alerts disabled to avoid persistent false positives.
        defaultRules:
          rules:
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            etcd: false

        kubeControllerManager:
          enabled: false

        kubeProxy:
          enabled: false

        kubeScheduler:
          enabled: false

        kubeEtcd:
          enabled: false

        grafana:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          envValueFrom:
            LOKI_BASIC_AUTH_USERNAME:
              secretKeyRef:
                name: loki-basic-auth
                key: username
            LOKI_BASIC_AUTH_PASSWORD:
              secretKeyRef:
                name: loki-basic-auth
                key: password

          admin:
            existingSecret: grafana-secrets
            userKey: admin-user
            passwordKey: admin-password

          service:
            type: ClusterIP

          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: gentoo-internal-ca
            hosts:
              - grafana.gentoo.lan
            path: /
            pathType: Prefix
            tls:
              - secretName: grafana-gentoo-lan-tls
                hosts:
                  - grafana.gentoo.lan

          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.logging.svc.cluster.local
              basicAuth: true
              basicAuthUser: ${LOKI_BASIC_AUTH_USERNAME}
              secureJsonData:
                basicAuthPassword: ${LOKI_BASIC_AUTH_PASSWORD}
              isDefault: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false
          # With admissionWebhooks disabled there is no cert-gen job, so the
          # operator must not try to serve its endpoint over TLS (it would mount
          # a non-existent `*-admission` secret and never start).
          tls:
            enabled: false

        prometheus-node-exporter:
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          hostRootFsMount:
            enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: 8GB
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1536Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-rwo
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 12Gi

        alertmanager:
          enabled: true

          config:
            global:
              resolve_timeout: 5m
            route:
              group_by:
                - alertname
                - namespace
                - severity
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: "null"
            receivers:
              - name: "null"

          alertmanagerSpec:
            alertmanagerConfigSelector:
              matchLabels:
                alertmanagerConfig: monitoring-kube-prometheus-alertmanager

            alertmanagerConfigMatcherStrategy:
              type: None

            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-rwo
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
