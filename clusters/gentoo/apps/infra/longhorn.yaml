apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: infra
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: v1.11.1
      helm:
        releaseName: longhorn
        valuesObject:
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            createDefaultDiskLabeledNodes: true
            defaultDataPath: /var/lib/longhorn
            defaultReplicaCount: 2
            storageMinimalAvailablePercentage: 15
            storageOverProvisioningPercentage: 100
            # Backup target = throwaway MinIO on the workstation, reached over
            # tailscale. The endpoint + keys live in the operator-applied Secret
            # longhorn-backup-credential (NOT in git / Vault, so restores work
            # while Vault is sealed). Volume data (the PVC contents) uploads here
            # via the CSI "type: bak" VolumeSnapshotClass.
            backupTarget: s3://longhorn-backups@minio-default/
            backupTargetCredentialSecret: longhorn-backup-credential
          ingress:
            enabled: false
          longhornUI:
            replicas: 1
          persistence:
            defaultClass: false
            defaultClassReplicaCount: 2
            defaultFsType: ext4
            reclaimPolicy: Retain
          extraObjects:
            - apiVersion: longhorn.io/v1beta2
              kind: RecurringJob
              metadata:
                name: daily-filesystem-trim
                namespace: longhorn-system
              spec:
                cron: "17 3 * * *"
                task: filesystem-trim
                groups:
                  - default
                retain: 0
                concurrency: 2
            - apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: longhorn-rwo
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "30"
                fromBackup: ""
                fsType: ext4
                dataLocality: disabled
                unmapMarkSnapChainRemoved: ignored
                disableRevisionCounter: "true"
                dataEngine: v1
                backupTargetName: default
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
