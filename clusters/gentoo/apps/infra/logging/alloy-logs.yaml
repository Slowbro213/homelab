apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-logs
  namespace: argocd
spec:
  project: infra

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.8.0
    helm:
      releaseName: alloy-logs
      valuesObject:
        global:
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault

        controller:
          type: daemonset
          volumes:
            extra:
              - name: kube-audit-log
                hostPath:
                  path: /var/log/kubernetes/audit
                  type: DirectoryOrCreate

        alloy:
          extraEnv:
            - name: LOKI_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: loki-basic-auth
                  key: username
            - name: LOKI_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loki-basic-auth
                  key: password

          mounts:
            extra:
              - name: kube-audit-log
                mountPath: /var/log/kubernetes/audit
                readOnly: true

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            seccompProfile:
              type: RuntimeDefault

          configMap:
            create: true
            content: |
              logging {
                level  = "info"
                format = "logfmt"
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }

                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "node"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                stage.cri {}

                forward_to = [loki.write.default.receiver]
              }

              local.file_match "kube_audit" {
                path_targets = [
                  {"__path__" = "/var/log/kubernetes/audit/audit.log", "job" = "kube-audit"},
                ]
              }

              loki.source.file "kube_audit" {
                targets    = local.file_match.kube_audit.targets
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push"
                  basic_auth {
                    username = sys.env("LOKI_BASIC_AUTH_USERNAME")
                    password = sys.env("LOKI_BASIC_AUTH_PASSWORD")
                  }
                }
              }

        rbac:
          create: true

        configReloader:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
