apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra

  source:
    repoURL: https://github.com/Slowbro213/homelab.git
    targetRevision: main
    path: apps/cloudflared

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
