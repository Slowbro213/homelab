apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gentoo-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  sourceRepos:
    - https://github.com/Slowbro213/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
    - group: kyverno.io
      kind: ClusterPolicy
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Infra project - owns controllers, CRDs, webhooks, storage, networking, core services. Whitelists below reflect the exact kinds live in each Application's status.resources as of 2026-08-11; a chart change adding a new kind needs this list extended.
  sourceRepos:
    - https://charts.longhorn.io/
    - https://charts.min.io/
    - https://grafana.github.io/helm-charts
    - https://helm.releases.hashicorp.com
    - https://kyverno.github.io/kyverno
    - https://charts.jetstack.io
    - https://pkgs.tailscale.com/helmcharts
    - http://zotregistry.dev/helm-charts/
    - https://prometheus-community.github.io/helm-charts
    - https://github.com/Slowbro213/homelab.git
    - https://cloudnative-pg.github.io/charts
    - https://charts.bitnami.com/bitnami
    - https://falcosecurity.github.io/charts
    - https://charts.goauthentik.io
    - https://dl.gitea.com/charts/
    - https://argoproj.github.io/argo-helm
    - https://nats-io.github.io/k8s/helm/charts/
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: vault-secrets-operator
    - server: https://kubernetes.default.svc
      namespace: minio
    - server: https://kubernetes.default.svc
      namespace: registry
    - server: https://kubernetes.default.svc
      namespace: logging
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: databases 
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: redis
    - server: https://kubernetes.default.svc
      namespace: falco
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: authentik
    - server: https://kubernetes.default.svc
      namespace: cloudflare
    - server: https://kubernetes.default.svc
      namespace: cloudflare-friend
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: gitea-runners
    - server: https://kubernetes.default.svc
      namespace: nats
    - server: https://kubernetes.default.svc
      namespace: velero
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: kyverno.io
      kind: ClusterPolicy
    - group: networking.k8s.io
      kind: IngressClass
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: storage.k8s.io
      kind: StorageClass
    - group: trust.cert-manager.io
      kind: Bundle
  namespaceResourceWhitelist:
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: argocd-image-updater.argoproj.io
      kind: ImageUpdater
    - group: barmancloud.cnpg.io
      kind: ObjectStore
    - group: batch
      kind: Job
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: longhorn.io
      kind: RecurringJob
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: AlertmanagerConfig
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: postgresql.cnpg.io
      kind: Cluster
    - group: postgresql.cnpg.io
      kind: Database
    - group: postgresql.cnpg.io
      kind: ScheduledBackup
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: secrets.hashicorp.com
      kind: VaultConnection
    - group: velero.io
      kind: BackupStorageLocation
    - group: velero.io
      kind: VolumeSnapshotLocation
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  sourceRepos:
    - https://github.com/Slowbro213/homelab.git
    - https://git.thanaspapa.com/thanas-papa/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: apps
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: frontends
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  # namespace: "*" let any Application on this project (sourced from an external,
  # less-trusted app repo) deploy Secrets/Deployments into ANY namespace, including
  # sensitive ones like vault/argocd. Scoped to the namespaces the two current
  # frontend apps actually use; add a new namespace here when onboarding another one.
  sourceRepos:
    - https://git.thanaspapa.com/thanas-papa/*
    - https://github.com/Slowbro213/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: programmingclub
    - server: https://kubernetes.default.svc
      namespace: cntdwn
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    # programmingclub stores uploaded event/project images on a Longhorn volume.
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  sourceRepos:
    - https://github.com/Slowbro213/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: kyverno.io
      kind: ClusterPolicy
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultConnection
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
