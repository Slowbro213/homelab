apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-template
  namespace: apps
  labels:
    app.kubernetes.io/name: frontend-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-template
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: registry.gentoo.lan/frontends/frontend-template:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
