apiVersion: apps/v1
kind: Deployment
metadata:
  name: REPLACE_APP_NAME
  namespace: REPLACE_NAMESPACE
  labels:
    app.kubernetes.io/name: REPLACE_APP_NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: REPLACE_APP_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: REPLACE_APP_NAME
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: REPLACE_IMAGE_REF
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
