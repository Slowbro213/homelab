apiVersion: apps/v1
kind: Deployment
metadata:
  name: REPLACE_APP_NAME
  namespace: REPLACE_NAMESPACE
  labels:
    app.kubernetes.io/name: REPLACE_APP_NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: REPLACE_APP_NAME
  template:
    metadata:
      labels:
        app.kubernetes.io/name: REPLACE_APP_NAME
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: zot-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: registry.gentoo.lan/frontends/REPLACE_REPO:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
