name: build-and-scan

on:
  push:
    branches:
      - main

jobs:
  image:
    runs-on: gitea-kaniko
    env:
      REGISTRY: registry.gentoo.lan
      IMAGE_REPO: frontends/${{ gitea.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure registry auth
        shell: sh
        run: |
          mkdir -p ~/.docker
          AUTH="$(printf '%s:%s' "$ZOT_USERNAME" "$ZOT_PASSWORD" | base64 | tr -d '\n')"
          cat > ~/.docker/config.json <<EOF_AUTH
          {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
          EOF_AUTH

      - name: Build and push immutable image
        shell: sh
        run: |
          IMAGE="${REGISTRY}/${IMAGE_REPO}:${GITHUB_SHA}"
          kaniko-executor \
            --context "${PWD}" \
            --dockerfile "${PWD}/Dockerfile" \
            --destination "${IMAGE}" \
            --snapshot-mode=redo
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Scan image with Trivy (fail HIGH/CRITICAL)
        shell: sh
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${IMAGE}"

      - name: Resolve image digest
        shell: sh
        run: |
          DIGEST="$(crane digest "${IMAGE}")"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "Immutable image: ${IMAGE%@*}@${DIGEST}"

      - name: Publish branch convenience tag
        shell: sh
        run: |
          MAIN_IMAGE="${REGISTRY}/${IMAGE_REPO}:main"
          crane copy "${IMAGE}" "${MAIN_IMAGE}"
