apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-ruler-rules
  namespace: logging
data:
  tux-hardware.yaml: |
    groups:
      - name: tux-hardware
        rules:
          - alert: WifiFirmwareCrash
            expr: |
              sum by (node) (count_over_time({job="systemd-journal"} |= "iwlwifi" |~ "(?i)(Hardware error detected|ADVANCED_SYSASSERT|FSEQ_ERROR_CODE|Failing on timeout while stopping DMA channel|stuck for [0-9]+ ms)" [5m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "iwlwifi firmware crash detected on {{ $labels.node }}"
              description: "The iwlwifi WiFi driver crashed on {{ $labels.node }}. Since this node is WiFi-only, expect it to go unreachable (k3s, Vault raft, Longhorn iSCSI) until physically rebooted."
