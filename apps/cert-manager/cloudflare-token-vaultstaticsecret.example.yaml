apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  type: kv-v2
  mount: secret
  path: cert-manager/cloudflare
  refreshAfter: 1h
  vaultAuthRef: vault
  destination:
    create: true
    name: cloudflare-api-token
    overwrite: true
