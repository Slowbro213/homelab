apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-tls
  namespace: vault
spec:
  secretName: vault-internal-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active
    - vault-active.vault
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - vault-standby
    - vault-standby.vault
    - vault-standby.vault.svc
    - vault-standby.vault.svc.cluster.local
    - vault-0.vault-internal
    - vault-0.vault-internal.vault
    - vault-0.vault-internal.vault.svc
    - vault-0.vault-internal.vault.svc.cluster.local
    - vault-1.vault-internal
    - vault-1.vault-internal.vault
    - vault-1.vault-internal.vault.svc
    - vault-1.vault-internal.vault.svc.cluster.local
  issuerRef:
    name: gentoo-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-ha-server-tls
  namespace: databases
spec:
  secretName: postgres-ha-server-tls
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - postgres-ha-rw
    - postgres-ha-rw.databases
    - postgres-ha-rw.databases.svc
    - postgres-ha-rw.databases.svc.cluster.local
    - postgres-ha-ro
    - postgres-ha-ro.databases
    - postgres-ha-ro.databases.svc
    - postgres-ha-ro.databases.svc.cluster.local
    - postgres-ha-r
    - postgres-ha-r.databases
    - postgres-ha-r.databases.svc
    - postgres-ha-r.databases.svc.cluster.local
  issuerRef:
    name: gentoo-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-server-tls
  namespace: nats
spec:
  secretName: nats-server-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - nats
    - nats.nats
    - nats.nats.svc
    - nats.nats.svc.cluster.local
    - nats-headless
    - nats-headless.nats
    - nats-headless.nats.svc
    - nats-headless.nats.svc.cluster.local
  issuerRef:
    name: gentoo-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
