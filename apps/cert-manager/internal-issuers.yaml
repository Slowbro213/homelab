apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gentoo-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gentoo-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: gentoo-internal-ca
  secretName: gentoo-internal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: gentoo-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gentoo-internal-ca
spec:
  ca:
    secretName: gentoo-internal-ca
