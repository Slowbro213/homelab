apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-public-readonly-nginx
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-public-readonly-proxy
data:
  nginx.conf: |
    worker_processes  1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

      server {
        listen 8080;
        set $gitea_upstream http://gitea-http.gitea.svc.cluster.local:3000;
        server_name git.thanaspapa.com;

        location = /healthz {
          access_log off;
          return 204;
        }

        location ~* ^/(user/(login|sign_up|forgot_password|reset_password|activate|oauth2|two_factor|link_account|settings)|admin|repo/create|org/create)(/|$) {
          return 403;
        }

        location ~* ^/api/(v1/)?(admin|user|repos/.*/.*/(hooks|keys|collaborators|branches|contents|releases|issues|pulls))(/|$) {
          return 403;
        }

        location ~* git-receive-pack {
          return 403;
        }

        location / {
          limit_except GET {
            deny all;
          }

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_pass $gitea_upstream;
        }

        location ~* ^/.+\.git/git-upload-pack$ {
          limit_except POST {
            deny all;
          }

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_pass $gitea_upstream;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-public-readonly-proxy
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-public-readonly-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-public-readonly-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-public-readonly-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gitea-public-readonly-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-public-readonly-proxy
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-public-readonly-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitea-public-readonly-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
