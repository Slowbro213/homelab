# chroot isolation runs Dockerfile RUN steps via chroot instead of creating new
# namespaces, so image builds work as root in an unprivileged pod (no CAP_SYS_ADMIN,
# no user-namespace/subuid setup). netns "host" keeps RUN steps' networking simple.
[engine]
[containers]
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT",
]
netns = "host"
