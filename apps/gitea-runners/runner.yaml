apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-runners
  labels:
    app.kubernetes.io/name: gitea-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
    spec:
      imagePullSecrets:
        - name: zot-pull

      automountServiceAccountToken: false

      hostAliases:
        - ip: 10.43.187.55
          hostnames:
            - git.gentoo.lan

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: runner
          # act_runner + buildah (kaniko removed). Kaniko in host mode unpacked each build's
          # base image over the runner's own "/", wiping git/act_runner/crane/trivy mid-job;
          # buildah builds into isolated container storage under /var/lib/containers instead.
          image: registry.gentoo.lan/infra/gitea-runner-tools:0.3.0
          imagePullPolicy: IfNotPresent

          env:
            - name: GITEA_INSTANCE_URL
              value: https://git.gentoo.lan
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/gentoo-ca.crt
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/gentoo-ca.crt
            - name: HOME
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/.cache
            # buildah defaults for host-mode builds in an unprivileged (baseline PodSecurity)
            # pod: chroot isolation avoids needing new user namespaces, vfs avoids needing
            # /dev/fuse. The workflow sets these too; keeping them here makes manual invocations
            # behave the same.
            - name: BUILDAH_ISOLATION
              value: chroot
            - name: STORAGE_DRIVER
              value: vfs
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-registration
                  key: token
            # Label kept as "gitea-kaniko" (not renamed to buildah) so the existing
            # `runs-on: gitea-kaniko` in the app workflows keeps matching; ":host" runs steps
            # directly in this pod, which is required for buildah's container storage.
            - name: GITEA_RUNNER_LABELS
              value: gitea-kaniko:host

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            # buildah needs to unshare a mount namespace for the build container; the default
            # seccomp profile blocks the required syscalls (e.g. CLONE_NEWUSER/unshare) for a
            # process without CAP_SYS_ADMIN. Baseline PodSecurity permits Unconfined seccomp
            # (only the "restricted" level forbids it), so this overrides the pod default above.
            seccompProfile:
              type: Unconfined

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # The programmingclub image is a Debian/PHP base with composer + node_modules;
              # 4Gi was set when kaniko OOM-killed (137) on it, and buildah's build container
              # plus the vfs copy-up are comparably heavy, so keep the headroom.
              memory: 4Gi

          volumeMounts:
            - name: data
              mountPath: /data
            # buildah's container storage (graphroot). vfs makes a full copy per layer, so it is
            # disk-hungry; an emptyDir keeps it off the container's writable layer and it is
            # discarded with the pod.
            - name: containers-storage
              mountPath: /var/lib/containers
            - name: certs
              mountPath: /etc/ssl/certs/gentoo-ca.crt
              subPath: ca.crt
              readOnly: true

      volumes:
        - name: data
          emptyDir: {}
        - name: containers-storage
          emptyDir: {}
        - name: certs
          secret:
            secretName: gentoo-internal-ca-bundle
