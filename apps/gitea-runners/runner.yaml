apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-runners
  labels:
    app.kubernetes.io/name: gitea-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
    spec:
      imagePullSecrets:
        - name: zot-pull

      automountServiceAccountToken: false

      # Must match the traefik ClusterIP pinned in
      # apps/security-baseline/coredns-custom.yaml -- update both together after a
      # cluster rebuild (see the note there).
      hostAliases:
        - ip: 10.43.117.63
          hostnames:
            - git.gentoo.lan

      # Pinned to the node that carries the Localhost seccomp profile referenced below
      # (/var/lib/kubelet/seccomp/gitea-runner-buildah.json). The profile is a node-local file
      # and only this node has it, so the runner must land here for buildah to start.
      nodeSelector:
        kubernetes.io/hostname: registry.gentoo.lan

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: runner
          # act_runner + buildah (kaniko removed). Kaniko in host mode unpacked each build's
          # base image over the runner's own "/", wiping git/act_runner/crane/trivy mid-job;
          # buildah builds into isolated container storage under /var/lib/containers instead.
          image: registry.gentoo.lan/infra/gitea-runner-tools:0.3.0
          imagePullPolicy: IfNotPresent

          env:
            - name: GITEA_INSTANCE_URL
              value: https://git.gentoo.lan
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/gentoo-ca.crt
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/gentoo-ca.crt
            - name: HOME
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/.cache
            # buildah defaults for host-mode builds in an unprivileged (baseline PodSecurity)
            # pod: chroot isolation avoids needing new user namespaces, vfs avoids needing
            # /dev/fuse. The workflow sets these too; keeping them here makes manual invocations
            # behave the same.
            - name: BUILDAH_ISOLATION
              value: chroot
            - name: STORAGE_DRIVER
              value: vfs
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-registration
                  key: token
            # Label kept as "gitea-kaniko" (not renamed to buildah) so the existing
            # `runs-on: gitea-kaniko` in the app workflows keeps matching; ":host" runs steps
            # directly in this pod, which is required for buildah's container storage.
            - name: GITEA_RUNNER_LABELS
              value: gitea-buildah:host

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            # buildah must unshare(CLONE_NEWUSER) to build unprivileged, which RuntimeDefault
            # blocks without CAP_SYS_ADMIN. Unconfined is not an option: PodSecurity "baseline"
            # (and Kyverno restrict-seccomp) both forbid it. A Localhost profile is allowed by
            # both and opens exactly the namespace/mount syscalls buildah needs while still
            # denying kexec/module-load/bpf/etc. The profile is installed on the pinned node at
            # /var/lib/kubelet/seccomp/gitea-runner-buildah.json.
            seccompProfile:
              type: Localhost
              localhostProfile: gitea-runner-buildah.json

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # buildah (vfs storage driver, chroot isolation) builds into its own container
              # storage under /var/lib/containers/storage in the runner's writable layer, so
              # peak memory still scales with the size of the image being built. 768Mi was
              # enough for the small bun/nginx frontends but OOM-killed (137) the runner
              # partway through the programmingclub image, which is a Debian/PHP base with
              # composer + node_modules.
              memory: 4Gi

          volumeMounts:
            - name: data
              mountPath: /data
            # buildah's container storage (graphroot). vfs makes a full copy per layer, so it is
            # disk-hungry; an emptyDir keeps it off the container's writable layer and it is
            # discarded with the pod.
            - name: containers-storage
              mountPath: /var/lib/containers
            - name: certs
              mountPath: /etc/ssl/certs/gentoo-ca.crt
              subPath: ca.crt
              readOnly: true

      volumes:
        - name: data
          emptyDir: {}
        - name: containers-storage
          emptyDir: {}
        - name: certs
          secret:
            secretName: gentoo-internal-ca-bundle
