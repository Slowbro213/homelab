apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-runners
  labels:
    app.kubernetes.io/name: gitea-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
    spec:
      imagePullSecrets:
        - name: zot-pull

      automountServiceAccountToken: false

      hostAliases:
        - ip: 10.43.187.55
          hostnames:
            - git.gentoo.lan

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: runner
          image: registry.gentoo.lan/infra/gitea-runner-tools:0.2.11-1
          imagePullPolicy: IfNotPresent

          env:
            - name: GITEA_INSTANCE_URL
              value: https://git.gentoo.lan
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/gentoo-ca.crt
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/gentoo-ca.crt
            - name: HOME
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/.cache
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-registration
                  key: token
            - name: GITEA_RUNNER_LABELS
              value: gitea-kaniko:host

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Kaniko runs in host mode and snapshots the whole filesystem, so peak memory
              # scales with the size of the image being built. 768Mi was enough for the small
              # bun/nginx frontends but OOM-killed (137) the runner partway through the
              # programmingclub image, which is a Debian/PHP base with composer + node_modules.
              memory: 4Gi

          volumeMounts:
            - name: data
              mountPath: /data
            - name: kaniko-dir
              mountPath: /kaniko
            - name: certs
              mountPath: /etc/ssl/certs/gentoo-ca.crt
              subPath: ca.crt
              readOnly: true

      volumes:
        - name: data
          emptyDir: {}
        - name: kaniko-dir
          emptyDir: {}
        - name: certs
          secret:
            secretName: gentoo-internal-ca-bundle
