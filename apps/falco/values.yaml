tty: true

controller:
  kind: daemonset

driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

collectors:
  enabled: true
  containerEngine:
    enabled: true
    engines:
      docker:
        enabled: false
      podman:
        enabled: false
      containerd:
        enabled: false
      cri:
        enabled: true
        sockets:
          - /run/k3s/containerd/containerd.sock
  kubernetes:
    enabled: false

falco:
  base_syscalls:
    repair: true
  priority: notice
  json_output: true
  json_include_output_property: true
  json_include_output_fields_property: true
  stdout_output:
    enabled: true
  syslog_output:
    enabled: false
  file_output:
    enabled: false
  http_output:
    enabled: false
  grpc_output:
    enabled: false
  webserver:
    enabled: true
    listen_port: 8765
    listen_address: 0.0.0.0

metrics:
  enabled: true
  interval: 15m
  resourceUtilizationEnabled: true
  stateCountersEnabled: true
  kernelEventCountersEnabled: true
  service:
    create: true
    type: ClusterIP
  serviceMonitor:
    create: true
    labels:
      release: monitoring
    interval: 30s

# buildah (`--isolation chroot`, see the gitea-runner CI workflows) copies itself into an
# anonymous memfd and execs that to run each Dockerfile RUN step inside the build rootfs,
# instead of writing a helper binary into the image being built. That is exactly the
# technique the stock "Fileless execution via memfd_create" rule watches for, so every CI
# build produced a burst of CRITICAL alerts. Upstream whitelists runc (which does the same
# memfd self-clone) but not buildah, so add the exception here — scoped to the runner image
# so the rule stays armed for every other container in the cluster.
customRules:
  gitea-runner-buildah.yaml: |-
    - macro: gitea_runner_buildah_memfd
      condition: >
        (container.image.repository = "registry.gentoo.lan/infra/gitea-runner-tools"
         and proc.exepath startswith "memfd:buildah-")

    - rule: Fileless execution via memfd_create
      condition: and not gitea_runner_buildah_memfd
      override:
        condition: append

falcoctl:
  artifact:
    follow:
      enabled: false

falcosidekick:
  enabled: true
  config:
    alertmanager:
      hostport: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
      endpoint: /api/v2/alerts
      minimumpriority: warning
      checkcert: false
  webui:
    enabled: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1234
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi
