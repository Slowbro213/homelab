tty: true

controller:
  kind: daemonset

driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

collectors:
  enabled: true
  containerEngine:
    enabled: true
    engines:
      docker:
        enabled: false
      podman:
        enabled: false
      containerd:
        enabled: false
      cri:
        enabled: true
        sockets:
          - /run/k3s/containerd/containerd.sock
  kubernetes:
    enabled: false

falco:
  priority: notice
  json_output: true
  json_include_output_property: true
  json_include_output_fields_property: true
  stdout_output:
    enabled: true
  syslog_output:
    enabled: false
  file_output:
    enabled: false
  http_output:
    enabled: false
  grpc_output:
    enabled: false
  webserver:
    enabled: true
    listen_port: 8765
    listen_address: 0.0.0.0

metrics:
  enabled: true
  interval: 15m
  resourceUtilizationEnabled: true
  stateCountersEnabled: true
  kernelEventCountersEnabled: true
  service:
    create: true
    type: ClusterIP
  serviceMonitor:
    create: true
    labels:
      release: monitoring
    interval: 30s

falcoctl:
  artifact:
    follow:
      enabled: false

falcosidekick:
  enabled: true
  config:
    alertmanager:
      hostport: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
      minimumpriority: warning
      checkcert: false
  webui:
    enabled: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1234
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi
