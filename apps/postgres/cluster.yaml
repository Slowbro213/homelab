apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
  namespace: databases
spec:
  instances: 3
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  certificates:
    serverTLSSecret: postgres-ha-server-tls
    serverCASecret: postgres-ha-server-tls
  managed:
    roles:
      # Owner of the `pclub` database (see database-programmingclub.yaml). The password comes
      # from Vault via the programmingclub-db VaultStaticSecret in this namespace.
      # connectionLimit and inherit are defaulted by CNPG; spelling them out keeps ArgoCD
      # from reporting the cluster as permanently OutOfSync against the mutated live object.
      - name: pclub
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: programmingclub-db
  postgresql:
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
    parameters:
      max_connections: "200"
      shared_buffers: "1024MB"
      effective_cache_size: "3072MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
  storage:
    size: 10Gi
    storageClass: longhorn-rwo
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/ha-cluster/
      endpointURL: http://minio.minio.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: postgres-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  monitoring:
    enablePodMonitor: true
  affinity:
    topologyKey: kubernetes.io/hostname
