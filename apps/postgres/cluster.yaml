apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
  namespace: databases
spec:
  instances: 3
  # Pin the PostgreSQL major to match the on-disk data (PG16). Without this the
  # cluster tracks the operator's default image (now PG18), which refuses to open
  # the PG16 data directory ("database files are incompatible"). A major-version
  # upgrade must be a deliberate, separate operation — not an implicit default.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10-standard-bookworm
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  certificates:
    serverTLSSecret: postgres-ha-server-tls
    serverCASecret: postgres-ha-server-tls
  managed:
    roles:
      # Owner of the `pclub` database (see database-programmingclub.yaml). The password comes
      # from Vault via the programmingclub-db VaultStaticSecret in this namespace.
      # connectionLimit and inherit are defaulted by CNPG; spelling them out keeps ArgoCD
      # from reporting the cluster as permanently OutOfSync against the mutated live object.
      - name: pclub
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: programmingclub-db
      # Owner of the `spyal` database (see database-spyal.yaml). Same shape as
      # pclub above: password from Vault via the spyal-db VaultStaticSecret in
      # this namespace, CNPG defaults spelled out for the same OutOfSync reason.
      #
      # Ordering hazard when adding a role here: the operator only grants the
      # instance manager's Role `get` on the new passwordSecret *by name* as
      # part of reconciling this spec. If the Secret does not exist yet (it is
      # created by a different Argo Application, apps/secrets/vault-sync, so
      # sync waves do not order the two), the reconciliation reads it, gets
      # `secrets "<name>" is forbidden`, and creates the role with NO password —
      # then marks it reconciled and does not retry. Postgres then rejects the
      # app with `password authentication failed ... has no password assigned`.
      # Recover by touching the *Cluster* — managed-role reconciliation hangs off
      # this object, not off the Secret, so annotating the Secret does nothing:
      #   kubectl -n databases annotate cluster postgres-ha nudge="$(date +%s)" --overwrite
      # Confirmed applied when .status.managedRolesStatus.passwordStatus.<role>
      # gains a resourceVersion (a bare transactionID means no password was set).
      - name: spyal
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: spyal-db
  postgresql:
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
    parameters:
      max_connections: "200"
      shared_buffers: "1024MB"
      effective_cache_size: "3072MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
  storage:
    size: 20Gi
    storageClass: longhorn-rwo
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # WAL archiving and base backups go through the Barman Cloud plugin (see
  # apps/cnpg-barman-plugin and objectstore.yaml) rather than the deprecated in-tree
  # barmanObjectStore support, since the "standard" image below doesn't bundle
  # barman-cli-cloud (only the deprecated "system" image variant does).
  # `enabled` is defaulted to true by CNPG. Argo CD owns spec.plugins as an
  # atomic list under server-side apply, so leaving it unset makes the rendered
  # list differ from the mutated live one and the app sits permanently
  # OutOfSync — same reason connectionLimit/inherit are spelled out above.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-ha-store
  monitoring:
    enablePodMonitor: true
  affinity:
    topologyKey: kubernetes.io/hostname
