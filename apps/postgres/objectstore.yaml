apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-ha-store
  namespace: databases
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://postgres-backups/ha-cluster/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: postgres-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-s3-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
