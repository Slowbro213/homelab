apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  replicas: 1
  strategy:
    # pgAdmin applies forward-only SQLite migrations at startup. Never overlap
    # old and new versions against the same ReadWriteOnce data volume.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgadmin
          image: docker.io/dpage/pgadmin4:9.17
          imagePullPolicy: IfNotPresent
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-credentials
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-credentials
                  key: PGADMIN_DEFAULT_PASSWORD
            - name: PGPASS_FILE
              value: /run/secrets/pgadmin/pgpass
            - name: PGADMIN_SERVER_JSON_FILE
              value: /etc/pgadmin/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            - name: PGADMIN_DISABLE_POSTFIX
              value: "True"
            - name: PGADMIN_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "True"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /misc/ping
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /etc/pgadmin/servers.json
              subPath: servers.json
              readOnly: true
            - name: credentials
              mountPath: /run/secrets/pgadmin
              readOnly: true
            - name: internal-ca
              mountPath: /etc/ssl/gentoo
              readOnly: true
            # pgAdmin/libpq falls back to this standard location when a server
            # definition does not retain an absolute sslrootcert path.
            - name: postgres-ca
              mountPath: /home/pgadmin/.postgresql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin-data
        - name: servers
          configMap:
            name: pgadmin-servers
        - name: credentials
          secret:
            secretName: pgadmin-credentials
        - name: internal-ca
          secret:
            secretName: gentoo-internal-ca-bundle
        - name: postgres-ca
          secret:
            secretName: gentoo-internal-ca-bundle
            items:
              - key: ca.crt
                path: root.crt
