apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  annotations:
    cert-manager.io/cluster-issuer: gentoo-internal-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - whoami.gentoo.lan
      secretName: whoami-gentoo-lan-tls
  rules:
    - host: whoami.gentoo.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80

    - host: test.thanaspapa.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
