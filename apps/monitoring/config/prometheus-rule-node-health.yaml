apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-health
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: node-health
      rules:
        - alert: SmartDiskFailing
          expr: smartctl_device_smart_status == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "SMART reports disk failure on {{ $labels.node }}"
            description: "smartctl_device_smart_status is 0 for device {{ $labels.device }} on node {{ $labels.node }} — the drive itself is reporting a failing health status."

        - alert: SmartDiskCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "NVMe critical warning flag set on {{ $labels.node }}"
            description: "smartctl_device_critical_warning is non-zero for device {{ $labels.device }} on node {{ $labels.node }} — the controller is reporting a critical condition (see NVMe SMART/Health log page)."

        - alert: HighMemoryPressureStall
          expr: rate(node_pressure_memory_stalled_seconds_total[5m]) * 100 > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sustained full memory pressure stall on {{ $labels.instance }}"
            description: "Over 50% of wall-clock time in the last 5m had all tasks blocked on memory (PSI full) for at least 15m straight — the node is likely thrashing."

        - alert: HighIOPressureStall
          expr: rate(node_pressure_io_stalled_seconds_total[5m]) * 100 > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sustained full IO pressure stall on {{ $labels.instance }}"
            description: "Over 50% of wall-clock time in the last 5m had all tasks blocked on IO (PSI full) for at least 15m straight."
