apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
  labels:
    alertmanagerConfig: monitoring-kube-prometheus-alertmanager
spec:
  route:
    receiver: discord
    # Falco alerts (via falcosidekick) carry none of Prometheus' label names: the rule name is
    # `rule`, not `alertname`, and the namespace is `k8s_ns_name`, not `namespace`. Without the
    # falco-side keys here every critical falco event grouped into one anonymous bucket, so a
    # burst from a single rule arrived as one wall-of-text message. Prometheus alerts don't
    # carry `rule`/`k8s_ns_name`, so adding them leaves Prometheus grouping unchanged.
    groupBy:
      - alertname
      - namespace
      - severity
      - rule
      - k8s_ns_name
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: severity
        matchType: =~
        value: critical

  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          content: >-
            {{ if eq .Status "firing" }}🚨 FIRING{{ else }}✅ RESOLVED{{ end }}
            {{ range .Alerts }}

            **{{ or .Labels.alertname .Labels.rule "unnamed alert" }}**
            Severity: `{{ .Labels.severity }}`
            Namespace: `{{ or .Labels.namespace .Labels.k8s_ns_name .Labels.hostname "-" }}`
            {{ if .Annotations.summary }}
            Summary: {{ .Annotations.summary }}
            {{ end }}
            {{ if .Annotations.description }}
            Description: {{ .Annotations.description }}
            {{ end }}
            {{ end }}
