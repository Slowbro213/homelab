apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-temperatures
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node-temperatures.json: |
    {
      "uid": "node-temperatures",
      "title": "Node Temperatures",
      "tags": ["node-exporter", "hardware"],
      "timezone": "browser",
      "graphTooltip": 1,
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU / Core Temperature (current max per node)",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "targets": [
            {
              "expr": "max by (nodename) (\n  node_hwmon_temp_celsius\n  * on(chip, instance) group_left(chip_name) node_hwmon_chip_names{chip_name=~\"k10temp|coretemp\"}\n  * on(instance) group_left(nodename) node_uname_info\n)",
              "legendFormat": "{{nodename}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "row",
          "title": "Time Series",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "CPU / Core Temperature",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": { "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "node_hwmon_temp_celsius\n* on(chip, instance) group_left(chip_name) node_hwmon_chip_names{chip_name=~\"k10temp|coretemp\"}\n* on(chip, sensor, instance) group_left(label) node_hwmon_sensor_label\n* on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}} · {{label}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "All Hardware Sensors (CPU, GPU, NVMe, ACPI, ...)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": { "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "node_hwmon_temp_celsius\n* on(chip, instance) group_left(chip_name) node_hwmon_chip_names\n* on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}} · {{chip_name}} ({{sensor}})"
            }
          ]
        }
      ]
    }
