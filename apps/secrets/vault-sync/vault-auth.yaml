# Reads only secret/programmingclub/db, so CNPG can provision the pclub role + database
# without widening the shared `postgres` Vault policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: programmingclub-db-sync
  namespace: databases
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: argocd
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd
    serviceAccount: vault-sync
