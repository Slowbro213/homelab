# Laravel expects the redis password as REDIS_PASSWORD; the shared secret/redis/auth stores
# it under `password`, so the key is remapped on the way in.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: programmingclub-redis
  namespace: programmingclub
spec:
  type: kv-v2
  mount: secret
  path: redis/auth
  refreshAfter: 1h
  vaultAuthRef: vault
  destination:
    create: true
    name: programmingclub-redis
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        REDIS_PASSWORD:
          text: '{{- get .Secrets "password" -}}'
---
