  refreshAfter: 1h
  vaultAuthRef: vault
  destination:
    create: true
    name: zot-pull
    overwrite: true
    type: kubernetes.io/dockerconfigjson
---
# Consumed by the CNPG Cluster's managed role (namespace `databases`, not the app namespace).
# kubernetes.io/basic-auth requires exactly the keys `username` and `password`.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: programmingclub-db
  namespace: databases
spec:
  type: kv-v2
  mount: secret
  path: programmingclub/db
  refreshAfter: 1h
  vaultAuthRef: programmingclub-db
  destination:
    create: true
    name: programmingclub-db
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      templates:
        username:
          text: '{{- get .Secrets "username" -}}'
        password:
          text: '{{- get .Secrets "password" -}}'
