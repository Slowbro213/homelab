# vmware-tanzu/velero Helm values. Volume data moves via Longhorn's backupTarget
# (Longhorn uploads the actual PVC data to its own S3 backup store), so Velero
# needs NO node-agent/datamover — only its controller + the built-in CSI feature.
# Velero here stores only the Kubernetes object metadata in its own MinIO bucket.
image:
  repository: velero/velero

# S3 plugin for the MinIO-backed BackupStorageLocation (object metadata).
# The initContainer runs restricted too (this cluster enforces the full Kyverno
# restricted PSS pack: seccomp, run-as-nonroot, drop-all-caps, no priv-esc).
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.1
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /target
        name: plugins

# Server-only: no per-node file mover.
deployNodeAgent: false
snapshotsEnabled: true

# Do NOT run the chart's velero-upgrade-crds hook Job: its pod/initContainer
# security context is not configurable and gets denied by the restricted Kyverno
# policies. Argo CD applies the chart's 13 CRDs directly (it includes crds/ by
# default) and re-applies them on every sync, so the upgrade Job is unnecessary.
upgradeCRDs: false

# Restricted-PSS compliant contexts (required cluster-wide by Kyverno).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

configuration:
  # Built-in CSI support (Velero >=1.14); no separate CSI plugin image needed.
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-metadata
      default: true
      config:
        region: minio-default
        s3ForcePathStyle: "true"
        # Throwaway MinIO on the workstation, reached over tailscale (LAN 9000 is
        # firewalled; the tailscale interface is trusted). Endpoint is disposable.
        s3Url: http://100.67.45.100:9000
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: minio-default

credentials:
  useSecret: true
  # Operator-applied Secret (NOT from Vault): Vault is sealed during a restore,
  # so Velero's object-store creds must be Vault-independent. See infra/velero.yaml.
  existingSecret: velero-minio-credentials

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# No scheduled backups yet; the Schedule is added in Task 18 after restore is proven.
schedules: {}
