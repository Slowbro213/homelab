# ============================================================
# Namespace: longhorn-system
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-egress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Kubernetes API for the Longhorn manager and CSI sidecars.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API backend endpoint(s) used by Service "kubernetes".
    # Some CNIs enforce policy on post-NAT destination IP/port.
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 6443

    # Longhorn services are reached via ClusterIP as well as pod IPs.
    # The admission webhook in particular is contacted through the service VIP.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 9500
        - protocol: TCP
          port: 9502
        - protocol: TCP
          port: 9503
        - protocol: TCP
          port: 8080

    # Longhorn components talk to each other through the namespace backend.
    # instance-manager engine/replica processes each claim their own TCP port
    # per volume (observed live in the 8500-8503 and 10000+ range, growing as
    # volumes/replicas are created), so this can't be pinned to a fixed list
    # like the manager/webhook ports (9500/9502/9503/8080) without silently
    # breaking cross-node replica sync as new ports get allocated.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-ingress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow other Longhorn components to reach Longhorn manager / UI / recovery
    # services, and instance-manager engine/replica processes on their
    # per-volume dynamic ports (see the matching egress rule above).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - protocol: TCP

    # Allow the dedicated Tailscale ingress to reach the Longhorn frontend service.
    # NetworkPolicy ports match the pod's real destination port, not the Service's
    # advertised one: longhorn-frontend listens on 80 but targetPort "http" is
    # container port 8000 (confirmed live via the Service's Endpoints), so this
    # has to be 8000 or the Tailscale ingress proxy 502s trying to reach it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8000

    # kubelet's iSCSI initiator (iscsiadm, run via nsenter into the host netns -
    # see nixos/ flake notes) connects directly to the instance-manager pod's
    # tgtd on 3260 to attach volumes; this traffic originates from the host,
    # not another pod, so it needs an explicit ipBlock like the k8s API egress
    # rule above.
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 3260

    # kube-apiserver calls the Longhorn admission (9502) and conversion (9503)
    # webhooks on the longhorn-manager pods. The apiserver runs in the host
    # netns, so like the iSCSI rule above this arrives from a node IP, not a
    # pod, and needs an explicit ipBlock.
    #
    # This failed *intermittently* before the rule existed: the webhook Service
    # has one endpoint per node, and same-node host->pod traffic bypasses
    # kube-router's FORWARD-chain policy enforcement while cross-node traffic
    # does not. So calls landing on the local manager succeeded and calls
    # landing on the other node's manager 502'd -- masked further by the
    # apiserver holding a persistent HTTP/2 connection to whichever endpoint it
    # picked first. Symptom: "failed calling webhook validator.longhorn.io ...
    # 502 Bad Gateway" on Longhorn CR writes, appearing and clearing at random.
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 9502
        - protocol: TCP
          port: 9503
