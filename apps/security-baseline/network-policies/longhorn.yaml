# ============================================================
# Namespace: longhorn-system
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-egress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Kubernetes API for the Longhorn manager and CSI sidecars.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API backend endpoint(s) used by Service "kubernetes".
    # Some CNIs enforce policy on post-NAT destination IP/port.
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 6443

    # Longhorn services are reached via ClusterIP as well as pod IPs.
    # The admission webhook in particular is contacted through the service VIP.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 9500
        - protocol: TCP
          port: 9502
        - protocol: TCP
          port: 9503
        - protocol: TCP
          port: 8080

    # Longhorn components talk to each other through the namespace backend.
    # instance-manager engine/replica processes each claim their own TCP port
    # per volume (observed live in the 8500-8503 and 10000+ range, growing as
    # volumes/replicas are created), so this can't be pinned to a fixed list
    # like the manager/webhook ports (9500/9502/9503/8080) without silently
    # breaking cross-node replica sync as new ports get allocated.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-ingress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow other Longhorn components to reach Longhorn manager / UI / recovery
    # services, and instance-manager engine/replica processes on their
    # per-volume dynamic ports (see the matching egress rule above).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
      ports:
        - protocol: TCP

    # Allow the dedicated Tailscale ingress to reach the Longhorn frontend service.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 80

    # kubelet's iSCSI initiator (iscsiadm, run via nsenter into the host netns -
    # see nixos/ flake notes) connects directly to the instance-manager pod's
    # tgtd on 3260 to attach volumes; this traffic originates from the host,
    # not another pod, so it needs an explicit ipBlock like the k8s API egress
    # rule above.
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 3260
