apiVersion: v1
kind: LimitRange
metadata:
  name: default-resource-limits
  namespace: chess
spec:
  limits:
    # No cpu in max or default, unlike the other app namespaces. A LimitRange
    # with a cpu max but no cpu default makes that max every container's limit,
    # and Stockfish runs 4 threads for a couple of minutes per game review: a
    # 500m cap would make one review take ~8x longer. The pod sets no CPU limit
    # on purpose (deploy/k8s/deployment.yaml in the chess repo).
    # Memory max 1Gi: the pod's limit is 640Mi (server + Stockfish with a
    # 128 MB hash peaked at 453 MiB; docs/budget.md in the chess repo).
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        memory: 256Mi
      max:
        memory: 1Gi
